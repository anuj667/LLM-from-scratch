# Standalone reference for the training hyperparameters that matter most
# for pretraining stability, independent of model size. gpt_nano.yaml and
# gpt_small.yaml each embed their own `training:` section (tuned for their
# scale); this file documents what each knob does and gives sane defaults
# to start tuning from for a new model size.

training:
  # -- Data ---------------------------------------------------------------
  train_bin: data/processed/train.bin
  val_bin: data/processed/val.bin
  out_dir: checkpoints

  # -- Batching -------------------------------------------------------------
  # Effective batch size (in sequences) = batch_size * grad_accum_steps.
  # Increase grad_accum_steps rather than batch_size if you run out of GPU
  # memory but still want a large effective batch.
  batch_size: 32
  grad_accum_steps: 1

  # -- Schedule length ------------------------------------------------------
  max_steps: 5000
  eval_interval: 250     # how often (in steps) to compute train/val loss
  eval_iters: 50         # how many random batches to average for eval loss
  log_interval: 20       # how often to print/record a training-loss line
  checkpoint_interval: 500

  # -- Learning rate: linear warmup -> cosine decay --------------------------
  # warmup_steps is typically 1-5% of max_steps. min_lr is typically
  # 1/10th of max_lr, following GPT-3's recipe.
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 200

  # -- Regularization / stability -------------------------------------------
  weight_decay: 0.1      # applied only to 2D+ params; see src/training/optimizer.py
  grad_clip: 1.0          # global-norm gradient clipping; 0 disables it

  # -- Precision ------------------------------------------------------------
  # "bfloat16" on a supporting GPU (A100/H100/RTX 30xx+); "float16" needs a
  # GradScaler (handled automatically in src/training/trainer.py) since it
  # has less dynamic range; "float32" for CPU or maximum numerical safety.
  dtype: bfloat16
  seed: 1337
